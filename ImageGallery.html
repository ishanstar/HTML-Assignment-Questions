<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Event Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            margin: 0;
        }

        header {
            text-align: center;
            background: #d9480f;
            color: white;
            padding: 25px;
        }

        .gallery {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        figure {
            margin: 0;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        figcaption {
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .gallery {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>College Event Gallery</h1>
    <p>Memorable moments from our college events</p>
</header>

<main class="gallery">

    <figure>
        <img src="event1.jpg"
             alt="Students participating in a college cultural event">
        <figcaption>Cultural Event</figcaption>
    </figure>

    <figure>
        <img src="event2.jpg"
             alt="Students attending a college seminar">
        <figcaption>College Seminar</figcaption>
    </figure>

    <figure>
        <img src="event3.jpg"
             alt="Students working together during a technology workshop">
        <figcaption>Technology Workshop</figcaption>
    </figure>

</main>

</body>
</html>
